<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红火蚁疫情防控监测系统</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-color: #d32f2f; /* 红色主题，符合红火蚁及预警色 */
            --secondary-color: #388e3c;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f8f9fa;
        }

        /* Sidebar Styles */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background-color: #2c3e50;
            color: white;
            transition: all 0.3s;
            z-index: 1000;
        }

        #sidebar .sidebar-header {
            padding: 20px;
            background-color: #1a252f;
            text-align: center;
        }

        #sidebar .nav-link {
            color: #bdc3c7;
            padding: 15px 20px;
            border-left: 4px solid transparent;
        }

        #sidebar .nav-link:hover, #sidebar .nav-link.active {
            color: white;
            background-color: #34495e;
            border-left-color: var(--primary-color);
        }

        #sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        /* Main Content Styles */
        #main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
            transition: all 0.3s;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .stat-card {
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        #map {
            height: 450px;
            border-radius: 10px;
            width: 100%;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .bg-warning-light { background-color: #fff3cd; color: #856404; }
        .bg-danger-light { background-color: #f8d7da; color: #721c24; }
        .bg-success-light { background-color: #d4edda; color: #155724; }

        @media (max-width: 768px) {
            #sidebar { margin-left: calc(-1 * var(--sidebar-width)); }
            #main-content { margin-left: 0; }
            #sidebar.active { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h5 class="mb-0"><i class="fas fa-bug"></i> RIFA 监测系统</h5>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link active" href="#"><i class="fas fa-tachometer-alt"></i> 首页仪表盘</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#"><i class="fas fa-map-marked-alt"></i> 疫情地图</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#"><i class="fas fa-clipboard-list"></i> 监测记录</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#reportModal"><i class="fas fa-plus-circle"></i> 疫情上报</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#"><i class="fas fa-book"></i> 防控知识库</a>
            </li>
            <li class="nav-item mt-auto">
                <a class="nav-link" href="#"><i class="fas fa-cog"></i> 系统设置</a>
            </li>
        </ul>
    </nav>

    <!-- Report Modal -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reportModalLabel">红火蚁疫情上报</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="reportForm">
                        <div class="mb-3">
                            <label class="form-label">发现地点</label>
                            <input type="text" class="form-control" placeholder="请输入详细地址" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">预计蚁巢数量</label>
                            <input type="number" class="form-control" placeholder="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">风险等级</label>
                            <select class="form-select">
                                <option value="low">低风险</option>
                                <option value="medium">中风险</option>
                                <option value="high">高风险</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">现场照片</label>
                            <input type="file" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注说明</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitReport()">提交报告</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4 px-3">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-outline-secondary d-md-none">
                    <i class="fas fa-bars"></i>
                </button>
                <h4 class="mb-0 ms-2">数据概览</h4>
                <div class="ms-auto d-flex align-items-center">
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fa-lg"></i> 管理员
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Stats Cards -->
        <div class="row">
            <div class="col-md-3">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-danger">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="ms-3">
                            <p class="text-muted mb-0">累计发现点</p>
                            <h3 class="mb-0">1,284</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-warning text-dark">
                            <i class="fas fa-vial"></i>
                        </div>
                        <div class="ms-3">
                            <p class="text-muted mb-0">待处理区域</p>
                            <h3 class="mb-0">42</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-success">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="ms-3">
                            <p class="text-muted mb-0">已根除点</p>
                            <h3 class="mb-0">856</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-primary">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="ms-3">
                            <p class="text-muted mb-0">监测人员</p>
                            <h3 class="mb-0">156</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts and Map -->
        <div class="row mt-2">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-white py-3">
                        <h6 class="mb-0 fw-bold">分布地图</h6>
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header bg-white py-3">
                        <h6 class="mb-0 fw-bold">月度疫情趋势</h6>
                    </div>
                    <div class="card-body">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Records Table -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h6 class="mb-0 fw-bold">最近监测动态</h6>
                        <button class="btn btn-sm btn-primary">查看全部</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>日期</th>
                                        <th>地点</th>
                                        <th>蚁巢数量</th>
                                        <th>状态</th>
                                        <th>监测员</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>2026-05-11</td>
                                        <td>城南新区湿地公园</td>
                                        <td>15个</td>
                                        <td><span class="status-badge bg-danger-light">高风险</span></td>
                                        <td>张伟</td>
                                        <td><button class="btn btn-sm btn-outline-primary">详情</button></td>
                                    </tr>
                                    <tr>
                                        <td>2026-05-10</td>
                                        <td>龙山路绿化带</td>
                                        <td>3个</td>
                                        <td><span class="status-badge bg-warning-light">中风险</span></td>
                                        <td>李娜</td>
                                        <td><button class="btn btn-sm btn-outline-primary">详情</button></td>
                                    </tr>
                                    <tr>
                                        <td>2026-05-10</td>
                                        <td>工业园区 A-2 区</td>
                                        <td>0个</td>
                                        <td><span class="status-badge bg-success-light">安全</span></td>
                                        <td>王强</td>
                                        <td><button class="btn btn-sm btn-outline-primary">详情</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize Map
        // Note: Using a default view for demonstration
        var map = L.map('map').setView([23.1291, 113.2644], 13); // Example: Guangzhou coords
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add some mock markers
        L.marker([23.1291, 113.2644]).addTo(map).bindPopup('城南新区监测点 - 高风险');
        L.marker([23.1350, 113.2700]).addTo(map).bindPopup('龙山路监测点 - 中风险');

        // Initialize Trend Chart
        const ctx = document.getElementById('trendChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1月', '2月', '3月', '4月', '5月'],
                datasets: [{
                    label: '新增疫情点',
                    data: [65, 59, 80, 81, 56],
                    borderColor: '#d32f2f',
                    backgroundColor: 'rgba(211, 47, 47, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });

        // Sidebar Toggle for Mobile
        document.getElementById('sidebarCollapse')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });

        // Submit Report Function
        function submitReport() {
            alert('报告提交成功！监测人员将尽快前往核实。');
            const modal = bootstrap.Modal.getInstance(document.getElementById('reportModal'));
            modal.hide();
            document.getElementById('reportForm').reset();
        }
    </script>
</body>
</html>
